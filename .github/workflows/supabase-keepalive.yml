# SPOTRA · Mantener Supabase activo (plan Free)
# Supabase pausa los proyectos gratuitos después de 7 días sin uso.
# Este workflow hace una consulta liviana cada 2 días para que no se pause.
# Usa la clave pública (anon) que ya está en config.js; no hace falta configurar nada.
name: Mantener Supabase activo

on:
  schedule:
    - cron: '0 12 */2 * *'   # cada 2 días a las 12:00 UTC
  workflow_dispatch:          # botón para correrlo a mano

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Consultar Supabase
        run: |
          URL=$(grep -o "SUPABASE_URL: *'[^']*'" config.js | cut -d"'" -f2)
          KEY=$(grep -o "SUPABASE_ANON_KEY: *'[^']*'" config.js | cut -d"'" -f2)
          CODE=$(curl -s -o /dev/null -w "%{http_code}" "$URL/rest/v1/places?select=id&limit=1" -H "apikey: $KEY" -H "Authorization: Bearer $KEY")
          echo "Respuesta de Supabase: $CODE"
          test "$CODE" = "200"
